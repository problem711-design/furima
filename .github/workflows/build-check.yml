name: build-check

# コミットされた状態のままコンパイルが通るかを push のたびに自動確認する。
# ここで確認するのはコンパイルまで (実機動作は対象外)。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server-csharp:
    name: PC server (C# / csc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build furima-server.exe / furima-sync.exe (same commands as tools/build-exe.bat)
        shell: cmd
        working-directory: tools
        run: |
          set CSC=%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist "%CSC%" set CSC=%SystemRoot%\Microsoft.NET\Framework\v4.0.30319\csc.exe
          "%CSC%" /nologo /codepage:65001 /out:furima-server.exe /target:winexe FurimaServerNative.cs SyncStore.cs DashboardHtml.cs TunnelQrForm.cs ClaudeJobStore.cs /reference:Newtonsoft.Json.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          "%CSC%" /nologo /codepage:65001 /out:furima-sync.exe /target:exe FurimaSyncNative.cs /reference:Newtonsoft.Json.dll /reference:System.Net.Http.dll
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

  android:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform 36 (the runner image ships the Android SDK)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Provide CI-only placeholder files (not real credentials; the APK is discarded)
        run: |
          cat > app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-ci",
              "storage_bucket": "dummy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.example.myapplication" }
                },
                "api_key": [ { "current_key": "dummy" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
