name: build-check

# コミットされた状態のままコンパイルが通るかを push のたびに自動確認する。
# ここで確認するのはコンパイルまで (実機動作は対象外)。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server-csharp:
    name: PC server (C# / csc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build furima-server.exe / furima-sync.exe and run C# unit tests
        shell: cmd
        working-directory: tools
        run: |
          set CSC=%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist "%CSC%" set CSC=%SystemRoot%\Microsoft.NET\Framework\v4.0.30319\csc.exe
          "%CSC%" /nologo /codepage:65001 /out:furima-server.exe /target:winexe FurimaServerNative.Core.cs FurimaServerNative.Auth.cs FurimaServerNative.Persistence.cs FurimaServerNative.Sync.cs FurimaServerNative.Items.cs FurimaServerNative.Photos.cs FurimaServerNative.MuseRef.cs FurimaServerNative.Claude.cs FurimaServerNative.ClaudeDelivery.cs SyncStore.cs DashboardHtml.cs TunnelQrForm.cs ClaudeJobStore.cs /resource:web\dashboard.html,FurimaDashboard.html /reference:Newtonsoft.Json.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          "%CSC%" /nologo /codepage:65001 /out:furima-sync.exe /target:exe FurimaSyncNative.cs /reference:Newtonsoft.Json.dll /reference:System.Net.Http.dll
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          "%CSC%" /nologo /codepage:65001 /out:furima-server-tests.exe /target:exe /main:FurimaServerTests tests\FurimaServerTests.cs FurimaServerNative.Core.cs FurimaServerNative.Auth.cs FurimaServerNative.Persistence.cs FurimaServerNative.Sync.cs FurimaServerNative.Items.cs FurimaServerNative.Photos.cs FurimaServerNative.MuseRef.cs FurimaServerNative.Claude.cs FurimaServerNative.ClaudeDelivery.cs SyncStore.cs DashboardHtml.cs TunnelQrForm.cs ClaudeJobStore.cs /resource:web\dashboard.html,FurimaDashboard.html /reference:Newtonsoft.Json.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          furima-server-tests.exe
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          del /q furima-server-tests.exe furima-server.exe furima-sync.exe
      - name: Dashboard & golden label tests - JS side
        run: node --test tools/tests/claude-label.test.mjs tools/tests/dashboard-ui-phase6-16.test.mjs tools/tests/photo-sync-integrity-build17.test.mjs

  android:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform 36 (the runner image ships the Android SDK)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Provide CI-only placeholder files (not real credentials; the APK is discarded)
        run: |
          cat > app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-ci",
              "storage_bucket": "dummy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.example.myapplication" }
                },
                "api_key": [ { "current_key": "dummy" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # debugConfig が参照する ~/.android/debug.keystore がランナーには無いため、標準のデバッグ用キーを生成する
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Unit tests - Android side
        run: gradle testDebugUnitTest --stacktrace
